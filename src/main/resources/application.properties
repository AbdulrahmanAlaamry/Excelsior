spring.application.name=Excelsior
spring.jackson.property-naming-strategy=SNAKE_CASE

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:excelsiordb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# IGDB API Credentials
igdb.client-id=${IGDB_CLIENT_ID}
igdb.client-secret=${IGDB_CLIENT_SECRET}
igdb.auth-url=https://id.twitch.tv/oauth2/token
igdb.api-url=https://api.igdb.com/v4
