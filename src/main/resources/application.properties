spring.application.name=Excelsior
server.port=${PORT:8080}
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.accept-single-value-as-array=true

# Neon PostgreSQL Configuration
spring.datasource.url=${NEON_URL}
spring.datasource.username=${NEON_USERNAME}
spring.datasource.password=${NEON_PASSWORD}

# HikariCP Pool Configuration (Resilience for Serverless Neon PostgreSQL)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=30000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# Management & Health Check for Render Deployment
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# IGDB API Credentials
igdb.client-id=${IGDB_CLIENT_ID}
igdb.client-secret=${IGDB_CLIENT_SECRET}
igdb.auth-url=https://id.twitch.tv/oauth2/token
igdb.api-url=https://api.igdb.com/v4

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
