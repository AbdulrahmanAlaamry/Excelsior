spring.application.name=Excelsior
server.port=${PORT:8080}
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.accept-single-value-as-array=true

# Neon PostgreSQL Configuration
spring.datasource.url=${NEON_URL}
spring.datasource.username=${NEON_USERNAME}
spring.datasource.password=${NEON_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Management & Health Check for Render Deployment
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# IGDB API Credentials
igdb.client-id=${IGDB_CLIENT_ID}
igdb.client-secret=${IGDB_CLIENT_SECRET}
igdb.auth-url=https://id.twitch.tv/oauth2/token
igdb.api-url=https://api.igdb.com/v4

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
