spring.application.name=Excelsior-Test
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.accept-single-value-as-array=true

# In-Memory H2 for automated testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Test mock credentials
igdb.client-id=test
igdb.client-secret=test
igdb.auth-url=http://test
igdb.api-url=http://test
jwt.secret=testSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLongForHmacSha256!
jwt.expiration-ms=86400000
